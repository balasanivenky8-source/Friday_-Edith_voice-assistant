name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VERSION_OUTPUT"

          RAW_VERSION="$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f1)"
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f2)"
          fi

          if ! echo "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::Unable to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool executable not found at $KEYTOOL_BIN."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty at $SOURCE_APK."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")"
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy debug APK to $ASSET_PATH."
            exit 1
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release APK asset is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have the .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Intended Purpose:** Testing only (not a Google Play Store production release)
          - **Signing:** Signed only with a temporary debug keystore generated on the runner
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo "- **GitHub Release Page:** $RELEASE_URL"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."

            {
              echo "### Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed. No GitHub Release URL was created."
              echo ""
              echo "- The debug APK build **succeeded**."
              echo "- Download the backup APK from the GitHub Actions artifact named \`app-debug-apk\` in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
